services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: paro
      POSTGRES_PASSWORD: paro
      POSTGRES_DB: paro
    ports:
      - "5432:5432"
    volumes:
      - paro_pg:/var/lib/postgresql/data
      - ./deploy/db/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paro -d paro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://paro:paro@db:5432/paro
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./Nifty Shares Viewer Wireframe/uploads:/app/uploads:ro
      - paro_storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://paro:paro@db:5432/paro
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./Nifty Shares Viewer Wireframe/uploads:/app/uploads:ro
      - paro_storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  paro_pg:
  paro_storage:
